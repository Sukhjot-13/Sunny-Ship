<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thousand Sunny</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0a1622; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .scene-frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .ship-utility-controls { top: 16px; }
      @media (max-width: 820px) {
        .ship-utility-controls { top: 84px; }
      }
      .sunny-title {
        position: absolute; inset: 0; display: flex; align-items: flex-end; z-index: 40;
        padding: clamp(20px, 5vw, 72px); cursor: pointer; color: #fff3d9;
        background: linear-gradient(0deg, #08151ef5, #0a1721a8 19%, transparent 54%);
      }
      .sunny-title-copy { text-shadow: 0 2px 16px #08151e; }
      .sunny-title h1 {
        max-width: 8ch; font-family: Georgia, serif; font-size: clamp(40px, 5.5vw, 84px);
        line-height: 0.98; font-weight: normal; letter-spacing: -0.04em;
      }
      .sunny-title p { margin: 14px 0 20px; font-size: 15px; color: #f0e5cf; }
      .sunny-title button, .voyage-controls button {
        padding: 9px 13px; border: 1px solid #d6b878; border-radius: 7px;
        background: #10283a; color: #fff3d9; cursor: pointer; font: inherit;
      }
      .sunny-title button { padding: 12px 17px; background: #f0d49a; color: #1b2932; font-weight: 650; }
      .voyage-controls {
        position: absolute; bottom: 16px; left: 16px; z-index: 20; width: 260px;
        max-width: calc(100vw - 32px); border-radius: 12px; padding: 12px;
        background: #0a1b28e8; border: 1px solid #a88d5b; color: #fff3d9; font-size: 13px;
      }
      .voyage-actions { display: flex; gap: 6px; }
      .voyage-actions button { flex: 1; white-space: nowrap; font-size: 12px; padding: 7px 8px; }
      .voyage-actions button[aria-pressed="true"] { background: #efce8e; color: #172836; }
      .voyage-controls kbd { margin-left: 3px; padding: 0 3px; border: 1px solid; border-radius: 3px; font-size: 10px; }
      .voyage-reading { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
      .voyage-label { color: #d6b878; font-size: 10px; text-transform: uppercase; letter-spacing: 0.13em; }
      .voyage-island { font-family: Georgia, serif; font-size: 21px; line-height: 1.25; }
      .voyage-range { font-variant-numeric: tabular-nums; color: #e2e6e6; }
      .log-pose-dial {
        position: relative; flex: 0 0 46px; height: 46px; border: 1px solid #a88d5b; border-radius: 50%;
        background: radial-gradient(circle, #d6b878 0 2px, transparent 3px), radial-gradient(circle, #203c4a, #0b1d2a);
      }
      .log-pose-dial::before {
        position: absolute; content: ''; inset: 4px; border-top: 2px solid #e4d6b8; border-radius: 50%;
      }
      .log-pose-dial i { position: absolute; inset: 4px; }
      .log-pose-dial i::before {
        position: absolute; content: ''; top: 1px; left: calc(50% - 3px); height: 16px; width: 6px;
        background: #b0b9b5; clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .log-pose-dial .selected::before { background: #ffd17e; }
      .voyage-instructions, .voyage-warning { margin-top: 8px; font-size: 12px; }
      .voyage-underway { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
      .voyage-underway > span { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .voyage-underway progress { width: 100%; min-width: 0; accent-color: #f0ce8e; }
      .voyage-underway button { flex: none; padding: 4px 7px; font-size: 12px; }
      .voyage-steering { display: none; gap: 7px; margin-top: 8px; touch-action: none; }
      .voyage-steering button { flex: 1; min-height: 40px; }
      @media (pointer: coarse) {
        .voyage-steering { display: flex; }
        .voyage-instructions, .voyage-controls kbd { display: none; }
      }
      .voyage-warning { color: #ffd17e; }
      @media (max-width: 620px) {
        .voyage-controls { bottom: 56px; }
        .sunny-title h1 { max-width: none; }
        .sunny-title { background: linear-gradient(0deg, #08151ef5, #0a1721b0 23%, transparent 50%); }
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
